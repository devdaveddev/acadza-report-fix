<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acadza Review Console</title>
<meta name="description" content="Faculty console for student error reports: queue, AI verdict, before/after diff, audit trail.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 17l5 5 10-12' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">✓</span><b>Review console</b><span class="muted hide-sm">· report → fix</span></div>
  <div class="progress" aria-live="polite"><div class="bar"><i id="barfill"></i></div><span id="progtxt" class="muted"></span></div>
  <div class="top-actions">
    <button class="ghost" id="btnAudit">Audit log <span class="count" id="auditCount">0</span></button>
    <button class="ghost" id="btnHelp" title="Keyboard shortcuts">?</button>
    <button class="ghost" id="btnTheme" title="Toggle theme">Theme</button>
  </div>
</header>
<div class="banner" id="banner"></div>
<main class="layout">
  <nav class="queue" id="queue" aria-label="Review queue"></nav>
  <section class="case" id="case" tabindex="-1"></section>
</main>
<aside class="drawer" id="drawer" hidden aria-label="Audit log"></aside>
<dialog id="help"><h3>Keyboard</h3><dl>
  <dt>J / K</dt><dd>next / previous case</dd><dt>A</dt><dd>approve proposed fix</dd>
  <dt>E</dt><dd>edit the replacement, then approve</dd><dt>R</dt><dd>reject</dd>
  <dt>U</dt><dd>undo last decision on this case</dd><dt>/</dt><dd>search</dd></dl>
  <form method="dialog"><button class="primary">Got it</button></form></dialog>
<script src="app.js" type="module"></script>
</body>
</html>
